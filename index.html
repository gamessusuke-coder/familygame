<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>かぞくゲーム</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#fdf3e1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="かぞくゲーム">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
         background: #fdf3e1; color: #5a3b1c; display: flex; justify-content: center; user-select: none; }
  html, body { overscroll-behavior: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  /* 画面の高さに収まるように幅を決める（iPhoneのホーム画面起動でもスクロールせずに遊べる） */
  .wrap { width: 100%; max-width: min(460px, calc((100dvh - 110px) * 400 / 580 + 36px)); padding: 12px;
          padding-top: max(12px, env(safe-area-inset-top)); padding-bottom: max(12px, env(safe-area-inset-bottom));
          padding-left: max(12px, env(safe-area-inset-left)); padding-right: max(12px, env(safe-area-inset-right)); }
  header { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: .05em; }
  .stats { display: flex; gap: 8px; }
  .box { background: #fff; border-radius: 12px; padding: 4px 10px; text-align: center; box-shadow: 0 2px 0 #e6cfa8; min-width: 64px; }
  .box small { display: block; font-size: 10px; color: #a07a4f; }
  .box b { font-size: 18px; }
  #nextCv { display: block; margin: 0 auto; }
  .stage { position: relative; }
  canvas#game { display: block; width: 100%; border-radius: 0 0 18px 18px; background: #fff7e6;
                border: 6px solid #e2b77a; border-top: none; touch-action: none; cursor: pointer; }
  .over { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
          background: rgba(90,59,28,.55); color: #fff; border-radius: 0 0 18px 18px; }
  .over.show { display: flex; }
  .over h2 { margin: 0 0 6px; font-size: 28px; }
  button { font: inherit; border: none; background: #f08a3c; color: #fff; padding: 8px 18px; border-radius: 999px;
           font-weight: bold; cursor: pointer; box-shadow: 0 3px 0 #c66a26; }
  button:active { transform: translateY(2px); box-shadow: 0 1px 0 #c66a26; }
  .legend { margin-top: 10px; background: #fff; border-radius: 14px; padding: 10px; box-shadow: 0 2px 0 #e6cfa8; }
  .legend p { margin: 0 0 6px; font-size: 12px; color: #a07a4f; }
  .chain { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .chain div { text-align: center; font-size: 10px; white-space: nowrap; overflow: hidden; cursor: pointer; border-radius: 8px; padding: 2px 0; }
  .chain div:hover { background: #fdf3e1; }
  .chain canvas { width: 44px; height: 44px; display: block; margin: 0 auto; }
  .row { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; gap: 8px; }
  .row span { font-size: 11px; color: #a07a4f; }
  .editor { margin-top: 10px; border-top: 1px dashed #e6cfa8; padding-top: 10px; }
  .ed-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .ed-head canvas { width: 40px; height: 40px; }
  .editor label { display: block; font-size: 11px; color: #a07a4f; margin-bottom: 6px; }
  .editor input[type=text] { width: 100%; font: inherit; font-size: 14px; padding: 6px 8px; border: 1px solid #e6cfa8; border-radius: 8px; color: #5a3b1c; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; }
  .btns button, .small { font-size: 12px; padding: 6px 12px; }
  .ghost { background: #fff; color: #a0602a; box-shadow: 0 2px 0 #e6cfa8; border: 1px solid #e6cfa8; }
  .chain div.sel { background: #fde4c4; }
  .vmark { display: block; font-size: 9px; color: #f08a3c; height: 11px; }
  select { font: inherit; font-size: 12px; border: 1px solid #e6cfa8; border-radius: 8px; padding: 4px; color: #5a3b1c; background: #fff; }
  .chk { font-size: 12px; cursor: pointer; }
  .chk span { font-size: 10px; color: #a07a4f; }
  .chk input[type=checkbox] { accent-color: #f08a3c; transform: scale(1.2); margin-right: 4px; }
  /* ===== タイトル画面 ===== */
  #title { position: fixed; inset: 0; z-index: 50; background: radial-gradient(circle at 50% 35%, #fff7e6 0%, #fde4c4 70%, #f7cf9c 100%);
           display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center;
           padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom)); transition: opacity .35s; }
  #title.hide { opacity: 0; pointer-events: none; }
  #titleCv { width: min(88vw, 380px, 46dvh); aspect-ratio: 1; }
  .logo { font-size: clamp(36px, 11vw, 54px); font-weight: 900; margin: 0; color: #f08a3c; letter-spacing: .06em;
          text-shadow: 0 4px 0 #c66a26, 0 6px 12px rgba(90,59,28,.25); -webkit-text-stroke: 2px #fff; paint-order: stroke fill; }
  .sub { margin: -6px 0 0; font-size: 13px; color: #a07a4f; }
  .modeBtns { display: flex; flex-direction: column; gap: 12px; width: min(80vw, 320px); }
  .modeBtn { display: flex; flex-direction: column; align-items: center; padding: 12px 20px; font-size: 20px; }
  .modeBtn small { font-size: 11px; font-weight: normal; opacity: .9; margin-top: 2px; }
  .modeBtn.hard { background: #8a4b2a; box-shadow: 0 3px 0 #5e3018; }
  .modeTag { display: block; width: fit-content; white-space: nowrap; margin-top: 2px; font-size: 11px; background: #f08a3c; color: #fff; border-radius: 999px; padding: 2px 8px; vertical-align: middle; margin-left: 4px; }
  .modeTag.hard { background: #8a4b2a; }
  @keyframes pulse { 50% { transform: scale(1.06); } }
  .tbest { font-size: 13px; color: #a07a4f; }
  .tbest b { font-size: 18px; color: #5a3b1c; }
  .over .btns2 { display: flex; gap: 10px; }
  .ghostw { background: #fff; color: #a0602a; box-shadow: 0 3px 0 #e6cfa8; }
  .hrow { display: flex; align-items: center; gap: 6px; margin-top: 3px; }
  .hrow .modeTag { margin-top: 0; }
  .backBtn { font-size: 11px; padding: 3px 10px; background: #fff; color: #a0602a; box-shadow: 0 2px 0 #e6cfa8; border: 1px solid #e6cfa8; }
  .saveRow { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-top: 8px; font-size: 11px; color: #a07a4f; }
  .saveRow { flex-wrap: wrap; }
  .saveRow button { margin-left: auto; }
  .row { flex-wrap: wrap; }
  button { white-space: nowrap; }
  #hitWrap, label.chk:has(#mute) { white-space: nowrap; }
  .saveRow .ok { color: #3a9a5b; font-weight: bold; }
</style>
</head>
<body>
<div id="title">
  <canvas id="titleCv" width="760" height="760"></canvas>
  <h1 class="logo">かぞくゲーム</h1>
  <p class="sub">おなじ家族をくっつけて、さいごは…うんこ！？</p>
  <div class="modeBtns">
    <button id="startSimple" class="modeBtn"><b>シンプルモード</b><small>まるい当たり判定</small></button>
    <button id="startHard" class="modeBtn hard"><b>ハードモード</b><small>写真のかたちどおりの当たり判定</small></button>
  </div>
  <label class="chk"><input type="checkbox" id="titleWaiwai"> <b>わいわいモード</b>（全員ずっとしゃべる）</label>
  <div class="tbest">ベスト　シンプル <b id="titleBestS">0</b>　／　ハード <b id="titleBestH">0</b></div>
</div>
<div class="wrap">
  <header>
    <div>
      <h1>かぞくゲーム</h1>
      <div class="hrow"><span id="modeTag" class="modeTag">シンプル</span><button id="backBtn" class="backBtn">◀ タイトル</button></div>
    </div>
    <div class="stats">
      <div class="box"><small>スコア</small><b id="score">0</b></div>
      <div class="box"><small>ベスト</small><b id="best">0</b></div>
      <div class="box"><small>ネクスト</small><canvas id="nextCv" width="40" height="40" style="width:40px;height:40px"></canvas></div>
    </div>
  </header>
  <div class="stage">
    <canvas id="game"></canvas>
    <div class="over" id="confirm">
      <h2 style="font-size:22px">タイトルにもどる？</h2>
      <p>いまのゲームは終了します</p>
      <div class="btns2"><button id="cfYes">もどる</button><button id="cfNo" class="ghostw">つづける</button></div>
    </div>
    <div class="over" id="over">
      <h2>ゲームオーバー</h2>
      <p id="finalScore"></p>
      <div class="btns2"><button id="retry">もういちど</button><button id="toTitle" class="ghostw">タイトルへ</button></div>
    </div>
  </div>
  <div class="legend">
    <p>しんかの順番（同じ人がくっつくと次の人に！最後はうんこ）／ アイコンをタップすると写真・ボイスを設定できます。ハードモードは背景を切り抜いた写真（透過PNG）を使うと、その形が当たり判定になります</p>
    <div class="chain" id="chain"></div>
    <input type="file" id="file" accept="image/*" hidden>
    <input type="file" id="vfile" accept="audio/*" hidden>
    <div class="editor" id="editor" hidden>
      <div class="ed-head"><canvas id="edCv" width="80" height="80"></canvas><b id="edName"></b></div>
      <label>セリフ（声のファイルがない時は、この文を合成音声で読み上げます）<input type="text" id="edLine"></label>
      <div class="btns">
        <button class="small" id="bPlay">▶ 試聴</button>
        <button class="small ghost" id="bVoice">声のファイルを選ぶ</button>
        <button class="small ghost" id="bClearVoice" hidden>選んだ声を外す</button>
        <button class="small ghost" id="bPhoto">写真を選ぶ</button>
        <button class="small ghost" id="bClearPhoto" hidden>写真を外す</button>
      </div>
      <div class="saveRow"><span id="saveStatus">設定はこの端末に自動で保存されます</span>
        <button class="small ghost" id="bWipe">保存した設定をすべて消す</button>
      </div>
    </div>
    <div class="row">
      <label class="chk"><input type="checkbox" id="waiwai"> <b>わいわいモード</b><br><span>画面にいる全員がずっとしゃべり続けます</span></label>
      <div style="display:flex;gap:8px;align-items:center"><label class="chk" id="hitWrap" hidden><input type="checkbox" id="showHit"> 判定表示</label><label class="chk"><input type="checkbox" id="mute"> 消音</label><button id="reset" class="small">リセット</button></div>
    </div>
    <div class="row">
      <label class="chk" style="flex:1;display:block;min-width:0">落とす間隔 <b id="cdVal">0.8</b> 秒<br>
        <input type="range" id="cdRange" min="0.1" max="1.5" step="0.1" value="0.8" style="display:block;width:100%;margin:6px 0 0;box-sizing:border-box;accent-color:#f08a3c"></label>
    </div>
    <div class="row"><span>クリック / タップで落とす・ドラッグで位置合わせ</span></div>
  </div>
</div>

<script src="matter.min.js"></script>
<script>
// ===== 人物定義（スイカゲームの11段階に対応） =====
const PEOPLE = [
  { name: "三男",     line: "バーブー",   pitch: 1.9, rate: 1.2, r: 28,  bg: "#ffd6e0", skin: "#ffdcc2", hair: "#5a3b1c", style: "toddler", voice: "voices/sannan.mp3" },
  { name: "次男",     line: "ぶいぶいちん",   pitch: 1.6, rate: 1.2, r: 40,  bg: "#b8e0ff", skin: "#ffd9bd", hair: "#3b2614", style: "boy", voice: "voices/jinan.mp3" },
  { name: "長男",     line: "おとうしゃま",   pitch: 1.2, rate: 1.1, r: 56,  bg: "#9ad3a5", skin: "#f7cfae", hair: "#2a1a0d", style: "teenboy", voice: "voices/chonan.mp3" },
  { name: "お母さん", line: "知らんけど",     pitch: 1.3, rate: 1.0, r: 76,  bg: "#ffa69e", skin: "#f8d0ae", hair: "#3a2210", style: "mom", voice: "voices/okasan.mp3" },
  { name: "お父さん", line: "あいざいます！", pitch: 0.8, rate: 1.0, r: 102,  bg: "#8fb8ff", skin: "#efc39d", hair: "#1f140a", style: "dad", voice: "voices/otosan.mp3" },
  { name: "うんこ",   line: "ぶりっ！",     pitch: 0.6, rate: 0.9, r: 130, bg: "#ffe9a8", skin: "#9a6233", hair: "#7a4a22", style: "poop" },
];
const photos = new Array(PEOPLE.length).fill(null);

// ===== 人物の描画 =====
function drawPerson(ctx, x, y, r, lv, opt = {}) {
  const p = PEOPLE[lv];
  ctx.save();
  // 外枠
  if (!opt.noBg) {
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = p.bg; ctx.fill();
    ctx.lineWidth = Math.max(1, r * 0.05); ctx.strokeStyle = "rgba(90,59,28,.35)"; ctx.stroke();
  }

  if (photos[lv] && !opt.noPhoto) {
    const img = photos[lv], ir = r * 0.88;
    ctx.save(); ctx.beginPath(); ctx.arc(x, y, ir, 0, Math.PI * 2); ctx.clip();
    const s = Math.max(ir * 2 / img.width, ir * 2 / img.height);
    ctx.drawImage(img, x - img.width * s / 2, y - img.height * s / 2, img.width * s, img.height * s);
    ctx.restore(); ctx.restore(); return;
  }

  if (p.style === "poop") { drawPoop(ctx, x, y, r, p); ctx.restore(); return; }
  const fr = r * 0.72, fy = y + r * 0.06, st = p.style;
  // 後ろ髪（ロング系）
  if (st === "teengirl" || st === "mom") {
    ctx.fillStyle = p.hair; ctx.beginPath();
    ctx.ellipse(x, fy + fr * 0.15, fr * 1.12, fr * 1.08, 0, 0, Math.PI * 2); ctx.fill();
  }
  // おだんご・ツインテール（顔の後ろ）
  ctx.fillStyle = p.hair;
  if (st === "girl") { circ(ctx, x - fr * 0.95, fy - fr * 0.45, fr * 0.32); circ(ctx, x + fr * 0.95, fy - fr * 0.45, fr * 0.32); }
  if (st === "mom" || st === "grandma") circ(ctx, x, fy - fr * 1.02, fr * 0.33);
  // 顔
  ctx.fillStyle = p.skin; circ(ctx, x, fy, fr);
  // 耳
  circ(ctx, x - fr * 0.97, fy + fr * 0.05, fr * 0.16); circ(ctx, x + fr * 0.97, fy + fr * 0.05, fr * 0.16);

  // 前髪（顔円でクリップ）
  ctx.save(); ctx.beginPath(); ctx.arc(x, fy, fr * 1.01, 0, Math.PI * 2); ctx.clip();
  ctx.fillStyle = p.hair;
  if (st === "toddler") ctx.fillRect(x - fr, fy - fr, fr * 2, fr * 0.55);
  if (st === "boy" || st === "dad") { ctx.fillRect(x - fr, fy - fr, fr * 2, fr * 0.62); }
  if (st === "girl" || st === "teengirl" || st === "mom") {
    ctx.beginPath(); ctx.moveTo(x - fr, fy - fr * 0.1);
    ctx.quadraticCurveTo(x - fr * 0.5, fy - fr * 0.55, x, fy - fr * 0.42);
    ctx.quadraticCurveTo(x + fr * 0.5, fy - fr * 0.55, x + fr, fy - fr * 0.1);
    ctx.lineTo(x + fr, fy - fr); ctx.lineTo(x - fr, fy - fr); ctx.fill();
  }
  if (st === "teenboy") {
    ctx.fillRect(x - fr, fy - fr, fr * 2, fr * 0.5);
    ctx.beginPath();
    for (let i = 0; i <= 6; i++) { const px = x - fr + i * fr / 3; ctx.lineTo(px, fy - fr * 0.5 + (i % 2 ? fr * 0.22 : 0)); }
    ctx.lineTo(x + fr, fy - fr); ctx.lineTo(x - fr, fy - fr); ctx.fill();
  }
  if (st === "grandma") { ctx.fillRect(x - fr, fy - fr, fr * 2, fr * 0.5); }
  if (st === "grandpa" || st === "great") {
    ctx.fillRect(x - fr, fy - fr * 0.45, fr * 0.28, fr * 0.6); ctx.fillRect(x + fr * 0.72, fy - fr * 0.45, fr * 0.28, fr * 0.6);
  }
  ctx.restore();
  // スパイク（おにいちゃん）頭頂の飛び出し
  if (st === "teenboy") {
    ctx.fillStyle = p.hair; ctx.beginPath();
    ctx.moveTo(x - fr * 0.5, fy - fr * 0.86); ctx.lineTo(x - fr * 0.25, fy - fr * 1.25); ctx.lineTo(x, fy - fr * 0.95);
    ctx.lineTo(x + fr * 0.3, fy - fr * 1.22); ctx.lineTo(x + fr * 0.5, fy - fr * 0.86); ctx.fill();
  }
  // あかちゃんのくるん毛
  if (st === "baby") {
    ctx.strokeStyle = p.hair; ctx.lineWidth = Math.max(1, fr * 0.12); ctx.lineCap = "round";
    ctx.beginPath(); ctx.arc(x + fr * 0.1, fy - fr * 0.95, fr * 0.22, Math.PI * 0.9, Math.PI * 2.4); ctx.stroke();
  }

  // 目
  const ey = fy + fr * 0.02, ex = fr * 0.36;
  ctx.fillStyle = "#3a2210"; ctx.strokeStyle = "#3a2210"; ctx.lineCap = "round";
  if (st === "grandma" || st === "grandpa" || st === "great") {
    ctx.lineWidth = Math.max(1, fr * 0.07);
    [-1, 1].forEach(s => { ctx.beginPath(); ctx.arc(x + s * ex, ey + fr * 0.05, fr * 0.13, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); });
  } else {
    const er = st === "baby" || st === "toddler" ? fr * 0.11 : fr * 0.085;
    [-1, 1].forEach(s => { circ(ctx, x + s * ex, ey, er); ctx.fillStyle = "#fff"; circ(ctx, x + s * ex + er * 0.35, ey - er * 0.35, er * 0.35); ctx.fillStyle = "#3a2210"; });
  }
  // メガネ
  if (st === "grandpa" || st === "grandma" || st === "dad") {
    ctx.strokeStyle = st === "dad" ? "#222" : "#8a6a3a"; ctx.lineWidth = Math.max(1, fr * 0.05);
    [-1, 1].forEach(s => { ctx.beginPath(); ctx.arc(x + s * ex, ey, fr * 0.22, 0, Math.PI * 2); ctx.stroke(); });
    ctx.beginPath(); ctx.moveTo(x - ex + fr * 0.22, ey); ctx.lineTo(x + ex - fr * 0.22, ey); ctx.stroke();
  }
  // ほっぺ
  ctx.fillStyle = "rgba(255,120,120,.35)";
  [-1, 1].forEach(s => { ctx.beginPath(); ctx.ellipse(x + s * fr * 0.55, fy + fr * 0.3, fr * 0.16, fr * 0.1, 0, 0, Math.PI * 2); ctx.fill(); });
  // ひげ
  if (st === "great") {
    ctx.fillStyle = p.hair; ctx.beginPath(); ctx.ellipse(x, fy + fr * 0.62, fr * 0.5, fr * 0.42, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,.08)"; ctx.lineWidth = 1; ctx.stroke();
  }
  if (st === "dad" || st === "grandpa") {
    ctx.fillStyle = st === "dad" ? p.hair : p.hair;
    ctx.beginPath(); ctx.ellipse(x - fr * 0.14, fy + fr * 0.36, fr * 0.16, fr * 0.07, 0.2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x + fr * 0.14, fy + fr * 0.36, fr * 0.16, fr * 0.07, -0.2, 0, Math.PI * 2); ctx.fill();
  }
  // 口
  ctx.strokeStyle = "#a0392c"; ctx.lineWidth = Math.max(1, fr * 0.06);
  if (st === "baby") { ctx.fillStyle = "#e4776b"; circ(ctx, x, fy + fr * 0.42, fr * 0.09); }
  else if (st !== "great") { ctx.beginPath(); ctx.arc(x, fy + fr * 0.36, fr * 0.2, Math.PI * 0.15, Math.PI * 0.85); ctx.stroke(); }
  ctx.restore();
}
function drawPoop(ctx, x, y, r, p) {
  const u = r * 0.8, base = y + u * 0.7;
  const tiers = [[0, 0.95, 0.3], [-0.3, 0.75, 0.27], [-0.58, 0.52, 0.23]];
  ctx.fillStyle = p.skin; ctx.strokeStyle = p.hair; ctx.lineWidth = Math.max(1, u * 0.04);
  tiers.forEach(([dy, w, h]) => {
    ctx.beginPath(); ctx.ellipse(x, base + dy * u - h * u * 0.5, w * u, h * u, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  });
  // 先っぽ
  ctx.beginPath(); ctx.moveTo(x - u * 0.3, y - u * 0.18);
  ctx.quadraticCurveTo(x - u * 0.05, y - u * 0.75, x + u * 0.22, y - u * 0.8);
  ctx.quadraticCurveTo(x + u * 0.05, y - u * 0.45, x + u * 0.3, y - u * 0.18); ctx.closePath(); ctx.fill(); ctx.stroke();
  // ハイライト
  ctx.fillStyle = "rgba(255,255,255,.25)";
  ctx.beginPath(); ctx.ellipse(x - u * 0.45, base - u * 0.2, u * 0.18, u * 0.07, -0.3, 0, Math.PI * 2); ctx.fill();
  // 顔
  const fy = base - u * 0.42;
  ctx.fillStyle = "#fff"; circ(ctx, x - u * 0.28, fy, u * 0.13); circ(ctx, x + u * 0.28, fy, u * 0.13);
  ctx.fillStyle = "#2a1a0d"; circ(ctx, x - u * 0.26, fy + u * 0.02, u * 0.07); circ(ctx, x + u * 0.30, fy + u * 0.02, u * 0.07);
  ctx.fillStyle = "rgba(255,120,120,.45)";

// めり込み解消：合体で大きい人物が生まれた時などに、他の人物や壁と重なったままになるのを防ぐ

const PEN_TOL = 1.5;   // この深さ(px)までの人物どうしのめり込みは物理エンジンに任せる

        const B = list[j].mb;
        if (A.bounds.max.x < B.bounds.min.x || B.bounds.max.x < A.bounds.min.x ||
            A.bounds.max.y < B.bounds.min.y || B.bounds.max.y < A.bounds.min.y) continue;

const UPRIGHT_LIMIT = 45 * Math.PI / 180; // この角度までの傾きなら立ち直る

  for (const b of bodies) {

  }

  }

      Matter.Body.setVelocity(m, { x: m.velocity.x * 0.5, y: m.velocity.y * 0.5 });
      Matter.Body.setAngularVelocity(m, m.angularVelocity * 0.5);

      r.onupgradeneeded = () => r.result.createObjectStore("kv");

    } catch (e) { rej(e); }

async function idb(op, key, val) {

      const r = op === "get" ? st.get(key) : op === "put" ? st.put(val, key) : op === "del" ? st.delete(key) : op === "keys" ? st.getAllKeys() : st.clear();
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
  } catch (e) { console.warn("save failed", e); return undefined; }
}

async function saveItem(kind, lv, val) {

  const ring = 270, n = 5;
  tctx.strokeStyle = "rgba(240,138,60,.35)"; tctx.lineWidth = 6; tctx.setLineDash([14, 14]);
  tctx.beginPath(); tctx.arc(c, c, ring, 0, Math.PI * 2); tctx.stroke(); tctx.setLineDash([]);
  for (let i = 0; i < n; i++) {
    const a = -Math.PI / 2 + i * Math.PI * 2 / n + t / 6000;
    const bob = Math.sin(t / 300 + i) * 8;
    drawPerson(tctx, c + Math.cos(a) * ring, c + Math.sin(a) * ring + bob, 46 + i * 9, i);
  }
  const sq = 1 + Math.sin(t / 220) * 0.04;
  tctx.save(); tctx.translate(c, c + 20); tctx.scale(1 / sq, sq);
  drawPerson(tctx, 0, 0, 150, PEOPLE.length - 1); tctx.restore();
}
(function titleLoop(t) { drawTitle(t || 0); requestAnimationFrame(titleLoop); })();

buildChain(); reset(); loop();
(async () => {
  try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  await restoreSaved();      // 先に自分で設定したものを復元
  await loadBundledVoices(); // 同梱ボイスは、自分の声がない人物にだけ使う
})();
showTitleBest();
</script>
